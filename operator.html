<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPERATOR ANTREAN SPMB</title>

<!-- Halaman ini untuk PC desktop operator (bukan videotron). Orientasi landscape. -->

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
  background: url("./assets/bg.jpg") no-repeat center center fixed;
  background-size: cover;
  min-height: 100vh;
  overflow: hidden;
  color: white;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
}

.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.panel {
  width: 100%;
  max-width: 1100px;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 30px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

.title {
  text-align: center;
  font-size: 38px;
  font-weight: 800;
  margin-bottom: 25px;
  letter-spacing: 2px;
}

.display {
  text-align: center;
  padding: 20px;
  border-radius: 20px;
  background: rgba(0,0,0,.25);
  margin-bottom: 25px;
}

.display h2 { font-size: 24px; margin-bottom: 10px; }

.nomor {
  font-size: 90px;
  font-weight: 900;
  color: #00ff99;
  text-shadow: 0 0 25px rgba(0,255,153,.5);
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.loket {
  border: none;
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
  border-radius: 15px;
  cursor: pointer;
  background: #2563eb;
  color: white;
  transition: .25s;
}

.loket:hover { transform: translateY(-3px); }

.active {
  background: #00ff99 !important;
  color: black !important;
  box-shadow: 0 0 20px rgba(0,255,153,.5);
}

.actions { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

.btn {
  border: none;
  padding: 18px 35px;
  font-size: 20px;
  font-weight: bold;
  border-radius: 15px;
  cursor: pointer;
  transition: .25s;
}

.btn:hover { transform: scale(1.05); }

.next   { background: #22c55e; color: white; }
.recall { background: #f59e0b; color: white; }
.reset  { background: #ef4444; color: white; }

.status {
  margin-top: 20px;
  text-align: center;
  font-size: 18px;
  color: #cbd5e1;
}

/* VISUAL SYSTEM: SMANSASOO QUEUE — responsive desktop/tablet/mobile */
:root{color-scheme:dark;--mint:#00ff99;--line:rgba(255,255,255,.15)}
body{overflow:auto;background:radial-gradient(ellipse at top,#15365a 0%,#0b1930 48%,#050b16 100%);font-family:'Segoe UI',Arial,sans-serif}
.container{min-height:100vh;height:auto;padding:clamp(12px,2.5vw,28px);align-items:flex-start}
.panel{width:100%;max-width:1100px;margin:auto;padding:clamp(16px,3vw,30px);border-radius:clamp(18px,3vw,30px);background:rgba(255,255,255,.075);border:1px solid var(--line);box-shadow:0 18px 50px #0004}
.title{font-size:clamp(22px,3.5vw,38px);letter-spacing:.01em;margin-bottom:18px}
.display{padding:clamp(14px,2.5vw,24px);margin-bottom:18px}.display h2{font-size:clamp(16px,2.2vw,24px)}
.nomor{font-size:clamp(42px,9vw,90px);overflow-wrap:anywhere;letter-spacing:-.025em}
.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.3vw,15px);margin-bottom:18px}
.loket{min-width:0;min-height:54px;padding:clamp(12px,1.8vw,20px);font-size:clamp(15px,2vw,22px);touch-action:manipulation}
.actions{gap:12px}.btn{min-height:52px;padding:14px clamp(16px,3vw,35px);font-size:clamp(16px,2vw,20px);touch-action:manipulation}
.status{font-size:clamp(14px,1.7vw,18px);line-height:1.5;overflow-wrap:anywhere}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.container{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.actions .btn{flex:1;min-width:100%}.display{margin-bottom:14px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.title{font-size:22px}}


/* THEME CONTROL — system / dark / light */
:root{color-scheme:light dark}
body[data-theme="dark"]{color-scheme:dark}
body[data-theme="light"]{color-scheme:light;background-image:url("./assets/bg.jpg")!important;background-position:center!important;background-size:cover!important;background-attachment:fixed!important;color:#142033!important}
body[data-theme="light"] .header p,
body[data-theme="light"] .currentInfo,
body[data-theme="light"] .status,
body[data-theme="light"] .muted{color:#526174!important}
body[data-theme="light"] .current,
body[data-theme="light"] .card,
body[data-theme="light"] .panel{background:rgba(255,255,255,.78)!important;border-color:rgba(15,23,42,.12)!important;box-shadow:0 16px 40px rgba(15,23,42,.10)}
body[data-theme="light"] .overlay{background:rgba(239,246,255,.66)!important;backdrop-filter:blur(10px)}
body[data-theme="light"] .display{background:rgba(255,255,255,.62)!important}
body[data-theme="light"] .stat{background:rgba(15,23,42,.045)!important;border-color:rgba(15,23,42,.1)!important;color:#526174}
body[data-theme="light"] .currentNumber,
body[data-theme="light"] .nomor{color:#008f61;text-shadow:none}
body[data-theme="light"] .loket:not(.active){background:#dbeafe;color:#1e3a8a}
body[data-theme="light"] .btn.secondary{background:#dce5ee;color:#142033}
.theme-toggle{position:fixed;z-index:30;top:14px;right:14px;display:flex;align-items:center;gap:8px;min-height:42px;padding:9px 13px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(15,23,42,.55);color:#fff;backdrop-filter:blur(18px);box-shadow:0 6px 20px #0002;font:600 13px/1.2 'Segoe UI',Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.theme-toggle .gear{font-size:16px}
body[data-theme="light"] .theme-toggle{background:rgba(255,255,255,.82);border-color:rgba(15,23,42,.14);color:#142033}
.theme-toggle:focus-visible{outline:3px solid #00c982;outline-offset:3px}
@media(max-width:600px){.theme-toggle{top:8px;right:8px;min-height:40px;padding:8px 11px}.header{padding-top:42px}.title{padding-top:34px}body{padding-top:56px}}
@media print{.theme-toggle{display:none!important}}


/* SHARED SCHOOL IDENTITY + LIVE FIREBASE STATUS */
.school-header{display:flex;align-items:center;justify-content:center;gap:14px;max-width:1200px;margin:0 auto 22px;padding:14px 18px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(255,255,255,.075);backdrop-filter:blur(18px);box-shadow:0 12px 34px rgba(0,0,0,.16)}
.school-logo{width:58px;height:58px;flex:0 0 58px;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.92);padding:5px}
.school-identity{min-width:0;text-align:left}
.school-name{font-size:clamp(15px,2vw,21px);font-weight:800;line-height:1.25;letter-spacing:.01em}
.school-subtitle{margin-top:4px;font-size:clamp(12px,1.4vw,14px);color:#cbd5e1;line-height:1.4}
.connection-status{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;margin-left:auto;padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(15,23,42,.42);font-size:12px;font-weight:700;white-space:nowrap}
.connection-dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16);flex:0 0 9px}
.connection-status[data-state="connected"] .connection-dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.connection-status[data-state="disconnected"] .connection-dot{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.16)}
body[data-theme="light"] .school-header{background:rgba(255,255,255,.78);border-color:rgba(15,23,42,.12);box-shadow:0 12px 34px rgba(15,23,42,.08)}
body[data-theme="light"] .school-subtitle{color:#526174}
body[data-theme="light"] .connection-status{background:rgba(226,232,240,.72);border-color:rgba(15,23,42,.12);color:#142033}
.btn,.actions button,.primary,.secondary{min-height:48px;padding:12px 20px;font-size:16px;line-height:1.25;border-radius:13px;touch-action:manipulation}
button:focus-visible{outline:3px solid #00c982;outline-offset:3px}
@media(max-width:600px){.school-header{justify-content:flex-start;gap:10px;margin-bottom:16px;padding:12px;border-radius:16px}.school-logo{width:46px;height:46px;flex-basis:46px;border-radius:12px}.school-identity{flex:1}.connection-status{margin-left:0;padding:7px 9px;font-size:11px}.school-header{flex-wrap:wrap}.connection-status{margin-left:56px}.btn,.actions button,.primary,.secondary{width:100%;min-height:48px}}
</style>
</head>

<body>
<button class="theme-toggle screen-only" id="themeToggle" type="button" aria-label="Ganti tema" title="Tema: mengikuti sistem"><span class="gear" aria-hidden="true">⚙</span><span id="themeLabel">Otomatis</span></button>

<div class="overlay"></div>

<div class="container">
  <div class="panel">
    <div class="school-header" aria-label="Identitas sekolah dan status koneksi">
      <img class="school-logo" src="./assets/logo.png" alt="Logo SMAN 1 Sooko">
      <div class="school-identity"><div class="school-name">SMAN 1 Sooko</div><div class="school-subtitle">SMAN 1 Sooko · SPMB 2026/2027</div></div>
      <div class="connection-status" id="firebaseStatus" data-state="connecting" role="status" aria-live="polite"><span class="connection-dot" aria-hidden="true"></span><span id="firebaseStatusText">Menghubungkan Firebase…</span></div>
    </div>
    <div class="title">OPERATOR ANTREAN SPMB</div>
    <div style="text-align:center;margin:-12px 0 18px;color:#cbd5e1">Antrean bersama · nomor dipanggil berdasarkan urutan tiket dibuat</div>

    <div class="display">
      <h2>LOKET AKTIF</h2>
      <div class="nomor" id="current">---</div>
    </div>

    <!-- Tombol loket diisi otomatis dari config.js lewat script di bawah -->
    <div class="grid" id="gridLoket"></div>

    <div class="actions">
      <button class="btn next" onclick="nextCallOperator()">▶ NEXT</button>
      <button class="btn recall" onclick="recallCallOperator()">🔊 RECALL</button>
      <button class="btn reset" onclick="resetOperator()">⛔ RESET</button>
    </div>

    <div class="status" id="operatorStatus">Pilih meja untuk mulai melayani antrean.</div>
  </div>
</div>

<script type="module">
import {
  nextCall,
  recallCall,
  getCounter,
  playSound,
  daftarLoket,
} from "./js/app.js";
import { db, ref, onValue } from "./js/firebase.js";

let loket = "-";
let counter = 0;
let actionInProgress = false;

const current = document.getElementById("current");
const firebaseStatus = document.getElementById("firebaseStatus");
const firebaseStatusText = document.getElementById("firebaseStatusText");
onValue(ref(db, ".info/connected"), (snapshot) => {
  const connected = snapshot.val() === true;
  firebaseStatus.dataset.state = connected ? "connected" : "disconnected";
  firebaseStatusText.textContent = connected ? "Firebase Terhubung" : "Firebase Terputus";
  document.getElementById("operatorStatus").textContent = connected ? "Terhubung · siap melayani antrean bersama." : "Koneksi terputus · periksa jaringan internet."; 
}, () => {
  firebaseStatus.dataset.state = "disconnected";
  firebaseStatusText.textContent = "Firebase Bermasalah";
  document.getElementById("operatorStatus").textContent = "Koneksi Firebase bermasalah."; 
});
const gridLoket = document.getElementById("gridLoket");

/* BUAT TOMBOL LOKET DARI CONFIG.JS (via app.js) */
daftarLoket.forEach((k) => {
  const btn = document.createElement("button");
  btn.id = "btn" + k;
  btn.className = "loket";
  btn.textContent = "MEJA " + k;
  btn.onclick = () => setLoket(k);
  gridLoket.appendChild(btn);
});

function updateDisplay() {
  if (loket === "-") {
    current.innerText = "---";
    return;
  }
  current.innerText = counter || "---";
}

function highlight() {
  document.querySelectorAll(".loket").forEach((btn) => btn.classList.remove("active"));
  if (loket !== "-") {
    document.getElementById("btn" + loket)?.classList.add("active");
  }
}

window.setLoket = async function (l) {
  loket = l;
  counter = await getCounter(loket);
  updateDisplay();
  highlight();
};

window.nextCallOperator = async function () {
  if (loket === "-") {
    alert("Pilih meja terlebih dahulu");
    return;
  }
  if (actionInProgress) return;

  actionInProgress = true;
  try {
    const nomor = await nextCall(loket);
    // Gunakan nomor hasil transaksi, bukan menambah counter lokal,
    // agar tampilan operator konsisten saat ada operator lain.
    if (!nomor) { current.innerText = "---"; alert("Belum ada antrean yang menunggu."); return; }
    counter = nomor;
    updateDisplay();
    playSound("./sounds/ding.mp3");
  } catch (error) {
    console.error("Gagal memanggil antrean:", error);
    const code = error?.code ? "[" + error.code + "] " : "";
    const detail = error?.message || "Tidak ada detail error dari Firebase.";
    alert("Panggilan gagal. " + code + detail + "\n\nJika tertulis PERMISSION_DENIED, periksa Firebase Realtime Database Rules. Jika antrean kosong, cetak nomor terlebih dahulu.");
  } finally {
    actionInProgress = false;
  }
};

window.recallCallOperator = async function () {
  try {
    await recallCall(loket);
    playSound("./sounds/panggilan.mp3");
  } catch (error) {
    alert(error.message || "Belum ada nomor untuk dipanggil ulang.");
  }
};

window.resetOperator = async function () {
  if (loket === "-") {
    alert("Pilih meja terlebih dahulu");
    return;
  }
  alert("Reset per loket tidak tersedia pada antrean bersama. Gunakan dashboard admin untuk reset seluruh antrean.");
};

updateDisplay();
</script>


<script>
(function(){
 const key='smansasoo-queue-theme';
 const btn=document.getElementById('themeToggle');
 const label=document.getElementById('themeLabel');
 if(!btn||!label)return;
 const modes=['system','dark','light'];
 const names={system:'Otomatis',dark:'Gelap',light:'Terang'};
 function apply(mode){
   const resolved=mode==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):mode;
   document.body.dataset.theme=resolved;
   label.textContent=names[mode];
   btn.title='Tema: '+names[mode]+' · klik untuk mengganti';
   btn.setAttribute('aria-label','Tema '+names[mode]+'. Klik untuk mengganti tema.');
   btn.querySelector('.gear').textContent=mode==='light'?'☼':mode==='dark'?'☾':'⚙';
 }
 let mode='system';
 try{mode=localStorage.getItem(key)||'system';}catch(_){}
 if(!modes.includes(mode))mode='system';
 apply(mode);
 btn.addEventListener('click',function(){
   mode=modes[(modes.indexOf(mode)+1)%modes.length];
   try{localStorage.setItem(key,mode);}catch(_){}
   apply(mode);
 });
 if(window.matchMedia){
   const mq=window.matchMedia('(prefers-color-scheme: light)');
   mq.addEventListener?.('change',function(){if(mode==='system')apply(mode);});
 }
})();
</script>

</body>
</html>
