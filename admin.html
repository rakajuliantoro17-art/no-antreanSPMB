<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN CONTROL CENTER SPMB</title>

<!-- Halaman ini untuk PC desktop panitia/admin (bukan videotron). Orientasi landscape. -->

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
  background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
  min-height: 100vh;
  color: white;
  padding: 20px;
}

.header { text-align: center; margin-bottom: 25px; }
.header h1 { font-size: 42px; font-weight: 900; }
.header p { color: #cbd5e1; margin-top: 10px; }

.current {
  max-width: 1200px;
  margin: auto;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px);
  border-radius: 25px;
  padding: 30px;
  text-align: center;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,.15);
}

.currentTitle { font-size: 22px; margin-bottom: 10px; }

.currentNumber {
  font-size: 90px;
  font-weight: 900;
  color: #00ff99;
  text-shadow: 0 0 30px rgba(0,255,153,.5);
}

.currentInfo { margin-top: 10px; font-size: 18px; color: #cbd5e1; }

.actions {
  max-width: 1200px;
  margin: auto;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.btn {
  border: none;
  padding: 15px 30px;
  border-radius: 15px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: .25s;
}

.btn:hover { transform: translateY(-2px); }

.btn-danger  { background: #ef4444; color: white; }
.btn-warning { background: #f59e0b; color: white; }
.btn-success { background: #22c55e; color: white; }

.monitor {
  max-width: 1400px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 15px;
}

.card {
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.15);
  transition: .3s;
}

.card:hover { transform: translateY(-4px); }
.card h3 { margin-bottom: 10px; font-size: 24px; }

.nomor {
  font-size: 42px;
  font-weight: 900;
  color: #00ff99;
  margin-bottom: 10px;
}

.status { font-size: 14px; color: #cbd5e1; }

.footer {
  text-align: center;
  margin-top: 25px;
  color: #94a3b8;
  font-size: 14px;
}

@media (max-width: 1200px) {
  .monitor { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 768px) {
  .monitor { grid-template-columns: repeat(2, 1fr); }
  .currentNumber { font-size: 60px; }
}

/* VISUAL SYSTEM: SMANSASOO QUEUE — responsive desktop/tablet/mobile */
:root{color-scheme:dark;--bg:#071426;--panel:rgba(255,255,255,.075);--line:rgba(255,255,255,.14);--mint:#00ff99;--muted:#cbd5e1}
body{background:radial-gradient(ellipse at top,#15365a 0%,#0b1930 48%,#050b16 100%);padding:clamp(12px,2.4vw,28px);font-family:'Segoe UI',Arial,sans-serif}
.header{margin-bottom:clamp(16px,2.5vw,28px)}.header h1{font-size:clamp(24px,4vw,42px);letter-spacing:.02em}.header p{font-size:clamp(13px,1.7vw,17px)}
.current{width:100%;padding:clamp(16px,3vw,30px);border-radius:clamp(16px,2.5vw,25px);background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px #0003}
.currentTitle{font-size:clamp(14px,2vw,22px)}.currentNumber{font-size:clamp(42px,9vw,90px);overflow-wrap:anywhere}
.actions{width:100%;gap:12px}.actions .current{flex:1;min-width:min(100%,150px);margin:0}.actions .nomor{font-size:clamp(24px,4vw,42px);overflow-wrap:anywhere}
.btn{min-height:48px;padding:13px clamp(16px,3vw,30px);touch-action:manipulation}
.monitor{width:100%;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.3vw,15px)}
.card{min-width:0;padding:clamp(12px,1.8vw,20px);overflow-wrap:anywhere}.card h3{font-size:clamp(16px,2vw,24px)}.nomor{font-size:clamp(22px,3.2vw,42px);letter-spacing:-.03em}
@media(max-width:1100px){.monitor{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){body{padding:12px}.header{margin-bottom:16px}.monitor{grid-template-columns:repeat(2,minmax(0,1fr))}.actions .current{min-width:calc(50% - 8px)}.currentInfo{font-size:14px}}
@media(max-width:380px){.monitor{grid-template-columns:1fr}.actions .current{min-width:100%}.btn{width:100%}}

</style>
</head>

<body>

<div class="header">
  <h1>ADMIN CONTROL CENTER</h1>
  <p id="subHeader">Sistem Antrean Verifikasi SPMB</p>
</div>

<div class="current">
  <div class="currentTitle">ANTREAN TERPANGGIL</div>
  <div id="currentNumber" class="currentNumber">---</div>
  <div id="currentInfo" class="currentInfo">Menunggu panggilan...</div>
</div>

<div class="actions">
  <button class="btn btn-warning" onclick="resetDisplay()">RESET DISPLAY</button>
  <button class="btn btn-danger" onclick="resetAllData()">RESET SEMUA LOKET</button>
</div>

<div class="actions" style="margin-top:0">
  <div class="current" style="margin:0;min-width:180px"><div class="currentTitle">NOMOR TERAKHIR</div><div id="lastIssued" class="nomor">000</div></div>
  <div class="current" style="margin:0;min-width:180px"><div class="currentTitle">MENUNGGU</div><div id="waitingCount" class="nomor">0</div></div>
  <div class="current" style="margin:0;min-width:180px"><div class="currentTitle">SUDAH DILAYANI</div><div id="servedCount" class="nomor">0</div></div>
</div>
<div id="monitor" class="monitor"></div>

<div class="footer">Realtime Firebase Monitoring</div>

<script type="module">
import { listenCurrentCall, listenLoket, listenTickets, listenQueueMeta, resetAll, daftarLoket } from "./js/app.js";
import { db, ref, update } from "./js/firebase.js";
import { TAHUN_AJARAN } from "./js/config.js";

document.getElementById("subHeader").textContent =
  `Sistem Antrean Verifikasi SPMB ${TAHUN_AJARAN}`;

/* CURRENT CALL */
listenCurrentCall((data) => {
  if (!data) return;

  document.getElementById("currentNumber").innerText = data.nomor || "---";
  document.getElementById("currentInfo").innerText =
    `LOKET : ${data.loket || "-"} | STATUS : ${data.callType || "-"}`;
});

/* LOKET MONITOR — dibangun dari daftarLoket (config.js) */
listenLoket((data) => {
  const monitor = document.getElementById("monitor");
  monitor.replaceChildren();

  daftarLoket.forEach((k) => {
    const card = document.createElement("div");
    card.className = "card";

    const heading = document.createElement("h3");
    heading.textContent = `MEJA ${k}`;

    const nomorEl = document.createElement("div");
    nomorEl.className = "nomor";
    const nomor = String(data?.[k] ?? "---");
    nomorEl.textContent = nomor;

    const status = document.createElement("div");
    status.className = "status";
    status.textContent = "Antrean aktif di meja";

    card.append(heading, nomorEl, status);
    monitor.appendChild(card);
  });
});

listenQueueMeta((meta) => { document.getElementById("lastIssued").textContent = String(meta.lastIssued || 0).padStart(3, "0"); });
listenTickets((tickets) => {
  const list = Object.values(tickets || {});
  document.getElementById("waitingCount").textContent = list.filter((t) => t.status === "waiting").length;
  document.getElementById("servedCount").textContent = list.filter((t) => t.status === "completed").length;
});

/* RESET DISPLAY (hanya tampilan panggilan aktif) */
window.resetDisplay = async () => {
  if (!confirm("Reset display videotron?")) return;

  await update(ref(db), {
    "current_call/nomor": "---",
    "current_call/loket": "-",
    "current_call/counter": 0,
    "current_call/callType": "RESET",
    "current_call/updatedAt": Date.now(),
  });
};

/* RESET SEMUA LOKET */
window.resetAllData = async () => {
  if (!confirm("Reset seluruh antrean?")) return;
  await resetAll();
  alert("Seluruh antrean berhasil direset");
};
</script>

</body>
</html>
